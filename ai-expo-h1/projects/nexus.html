        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        playstationBlue: '#003791',

                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],

            </div>
            <div id="user-modal-items" class="overflow-y-auto space-y-3 flex-grow pr-1">
                <!-- Injected items -->

        </div>
    </div>

                genre: 'הכול',

                ageRating: 'הכול'

        function saveState() {
            localStorage.setItem('nexus_favs_pro', JSON.stringify(state.favorites));
            localStorage.setItem('nexus_played_pro', JSON.stringify(state.played));
            updateBadges();
        }

        function updateBadges() {
            const favBadge = document.getElementById('fav-badge');
            const playedBadge = document.getElementById('played-badge');
            if(favBadge) favBadge.textContent = state.favorites.length;
            if(playedBadge) playedBadge.textContent = state.played.length;
        }

        const router = {
            navigate(route, gameId = null) {
                state.currentRoute = route;
                state.selectedGameId = gameId;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                render();
            }
        };

        function render() {
            const container = document.getElementById('app-content');
            updateBadges();

            document.querySelectorAll('.nav-link').forEach(btn => {
                if (btn.dataset.route === state.currentRoute) {
                    btn.classList.add('text-cyan-400');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('text-cyan-400');
                    btn.classList.add('text-gray-400');
                }
            });

            if (state.currentRoute === 'home') {
                container.innerHTML = renderHome();
            } else if (state.currentRoute === 'library') {
                container.innerHTML = renderLibrary();
                initLibraryListeners();
            } else if (state.currentRoute === 'categories') {
                container.innerHTML = renderCategoriesView();
            } else if (state.currentRoute === 'surprise') {
                container.innerHTML = renderSurpriseGenerator();
            } else if (state.currentRoute === 'detail' && state.selectedGameId) {
                container.innerHTML = renderGameDetail(state.selectedGameId);
            }

        function updateFilters() {
            const searchEl = document.getElementById('filter-search');
            const genreEl = document.getElementById('filter-genre');
            const platformEl = document.getElementById('filter-platform');
            const ageEl = document.getElementById('filter-age');
            const scoreEl = document.getElementById('filter-score');

            if (searchEl) state.filters.search = searchEl.value.toLowerCase();
            if (genreEl) state.filters.genre = genreEl.value;
            if (platformEl) state.filters.platform = platformEl.value;
            if (ageEl) state.filters.ageRating = ageEl.value;
            if (scoreEl) state.filters.minScore = parseInt(scoreEl.value);
            
            const scoreVal = document.getElementById('score-val');
            if (scoreVal) scoreVal.textContent = state.filters.minScore;

            renderLibraryGrid();
        }

        function initLibraryListeners() {
            const searchEl = document.getElementById('filter-search');
            const genreEl = document.getElementById('filter-genre');
            const platformEl = document.getElementById('filter-platform');
            const ageEl = document.getElementById('filter-age');
            const scoreEl = document.getElementById('filter-score');

            if (searchEl) searchEl.value = state.filters.search;
            if (genreEl) genreEl.value = state.filters.genre;
            if (platformEl) platformEl.value = state.filters.platform;
            if (ageEl) ageEl.value = state.filters.ageRating;
            if (scoreEl) scoreEl.value = state.filters.minScore;
            
            const scoreVal = document.getElementById('score-val');
            if (scoreVal) scoreVal.textContent = state.filters.minScore;

            renderLibraryGrid();
        }

        function renderLibraryGrid() {
            const grid = document.getElementById('library-grid');
            if (!grid) return;

            const filtered = GAMES.filter(game => {
                const matchSearch = game.title.toLowerCase().includes(state.filters.search) || game.shortDesc.toLowerCase().includes(state.filters.search);
                const matchGenre = state.filters.genre === 'הכול' || game.genre === state.filters.genre;
                const matchPlatform = state.filters.platform === 'הכול' || game.platforms.includes(state.filters.platform);
                const matchScore = game.score >= state.filters.minScore;
                const matchAge = state.filters.ageRating === 'הכול' || game.ageRating <= parseInt(state.filters.ageRating);

                return matchSearch && matchGenre && matchPlatform && matchScore && matchAge;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center space-y-3">
                        <i class="fa-solid fa-ghost text-4xl text-gray-600"></i>
                        <p class="text-gray-400 text-lg">לא נמצאו משחקים העונים על תנאי הסינון (ציון מינימלי 75+).</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(game => renderGameCard(game)).join('');
        }

        function toggleFavorite(gameId) {
            const index = state.favorites.indexOf(gameId);
            if (index > -1) {
                state.favorites.splice(index, 1);
                showToast('המשחק הוסר מרשימת האהובים', 'info');
            } else {
                state.favorites.push(gameId);
                showToast('המשחק נוסף לרשימת האהובים! ❤️');
            }
            saveState();
            render();
        }

        function togglePlayed(gameId) {
            const index = state.played.indexOf(gameId);
            if (index > -1) {
                state.played.splice(index, 1);
                showToast('המשחק הוסר מרשימת המשחקים ששיחקת', 'info');
            } else {
                state.played.push(gameId);
                showToast('המשחק סומן כ"שיחקתי"! 🎮');
            }
            saveState();
            render();
        }

        function triggerSurprise() {
            const platform = document.getElementById('supr-platform').value;
            let pool = GAMES.filter(g => g.score >= 75);
            if (platform !== 'הכול') {
                pool = pool.filter(g => g.platforms.includes(platform));
            }
            if (pool.length === 0) pool = GAMES;

            const randomGame = pool[Math.floor(Math.random() * pool.length)];
            const resultArea = document.getElementById('surprise-result');
            resultArea.classList.remove('hidden');
            resultArea.innerHTML = `
                <div class="space-y-4 animate-in fade-in zoom-in duration-300">
                    <div class="text-sm font-bold text-cyan-400">✨ ההמלצה עבורך (דירוג ${randomGame.score}):</div>
                    ${renderGameCard(randomGame)}
                </div>
            `;
            showToast(`נבחר באקראי: ${randomGame.title}`);
        }

        function openUserModal(type) {
            const modal = document.getElementById('user-list-modal');
            const title = document.getElementById('user-modal-title');
            const itemsContainer = document.getElementById('user-modal-items');

            const ids = type === 'favorites' ? state.favorites : state.played;
            const items = GAMES.filter(g => ids.includes(g.id));

            if (type === 'favorites') {
                title.innerHTML = `<i class="fa-solid fa-heart text-pink-500"></i> המשחקים שאהבתי (${items.length})`;
            } else {
                title.innerHTML = `<i class="fa-solid fa-check-circle text-cyan-400"></i> משחקים ששיחקתי (${items.length})`;
            }

            if (items.length === 0) {
                itemsContainer.innerHTML = `<p class="text-gray-500 text-center py-8">הרישום ריק כרגע. התחל לסמן משחקים!</p>`;
            } else {
                itemsContainer.innerHTML = items.map(game => `
                    <div class="flex items-center justify-between p-4 bg-darkBg rounded-2xl border border-gray-800">
                        <div class="flex items-center gap-4 cursor-pointer" onclick="closeUserModal(); router.navigate('detail', '${game.id}')">
                            <img src="${game.image}" class="w-16 h-12 object-cover rounded-xl">
                            <div>
                                <h4 class="font-bold text-white hover:text-cyan-400">${game.title}</h4>
                                <span class="text-xs text-gray-400">${game.genre} | ציון: ${game.score} | ${game.platforms.join(', ')}</span>
                            </div>
                        </div>
                        <button onclick="${type === 'favorites' ? `toggleFavorite('${game.id}')` : `togglePlayed('${game.id}')`}; openUserModal('${type}')" class="text-gray-500 hover:text-red-400 p-2">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');
            }

            modal.classList.remove('hidden');
        }

        function closeUserModal() {
            document.getElementById('user-list-modal').classList.add('hidden');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            msgEl.textContent = message;
            if (type === 'success') {
                iconEl.className = 'fa-solid fa-circle-check text-cyan-400 text-xl';
            } else {
                iconEl.className = 'fa-solid fa-circle-info text-blue-400 text-xl';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
